<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animated SOG viewer</title>
    <link rel="icon" href="data:,">
    <!--
        Animated SOG (.asog) viewer on three.js (WebGL 2).
        URL parameters: ?src=<url of an .asog file>  ?volume=0..1
        Serve the repository root (e.g. npx http-server . -p 8765) and open /examples/three/.
    -->
    <script>
        // long tasks from the very start (read by viewer.js and by tests)
        window.asogLongTasks = [];
        try {
            new PerformanceObserver((list) => {
                for (const e of list.getEntries()) window.asogLongTasks.push({ start: Math.round(e.startTime), duration: Math.round(e.duration) });
            }).observe({ type: "longtask", buffered: true });
        } catch (e) { /* no longtask support */ }
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/"
            }
        }
    </script>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; }
        #info { position: fixed; top: 10px; left: 12px; right: 12px; pointer-events: none; text-shadow: 0 1px 2px #000; white-space: pre-wrap; }
        #error { color: #f77; }
        #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 10px 12px;
               background: linear-gradient(transparent, rgba(0, 0, 0, 0.7)); }
        #bar button { background: rgba(255, 255, 255, 0.12); color: #eee; border: 1px solid rgba(255, 255, 255, 0.25);
                      border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; min-width: 64px; }
        #bar button:hover { background: rgba(255, 255, 255, 0.22); }
        #scrub { flex: 1; min-width: 0; accent-color: #9cf; }
        #clock { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="info">Loading…</div>
    <div id="bar">
        <button id="play" type="button">Pause</button>
        <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time">
        <span id="clock">0.00 / 0.00 s</span>
        <button id="sound" type="button" hidden>Enable sound</button>
    </div>
    <script type="module" src="./viewer.js"></script>
</body>
</html>
