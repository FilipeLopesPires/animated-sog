<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Animated SOG compare</title>
    <link rel="icon" href="data:,">
    <!--
        Two .asog clips side by side on one camera and one clock: the left of the line shows clip A, the right clip B.
        Move the mouse to move the line (touch: drag it), drag to turn, wheel or pinch to zoom; zooming in moves the
        camera onto the face. URL parameters: ?a=<url> ?b=<url> ?la=<label A> ?lb=<label B> ?webgpu=0|1 ?volume=0..1
    -->
    <script type="importmap">
        {
            "imports": {
                "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.22.6/build/playcanvas.mjs"
            }
        }
    </script>
    <style>
        html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
        canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
        #canvas-b { clip-path: inset(0 0 0 50%); }
        #touch { position: fixed; inset: 0; touch-action: none; cursor: ew-resize; }
        #touch.turning { cursor: grabbing; }
        #line { position: fixed; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: #fff;
                box-shadow: 0 0 6px rgba(0, 0, 0, 0.6); pointer-events: none; }
        #line::after { content: ""; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px;
                       border-radius: 50%; border: 2px solid #fff; background: rgba(0, 0, 0, 0.35); }
        .label { position: fixed; top: 14px; pointer-events: none; text-shadow: 0 1px 3px #000; }
        .label b { display: block; font-size: 22px; color: #fff; }
        .label span { color: #ccc; }
        #label-a { left: 16px; }
        #label-b { right: 16px; text-align: right; }
        #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: center; padding: 10px 12px;
               background: linear-gradient(transparent, rgba(0, 0, 0, 0.7)); }
        #bar button { background: rgba(255, 255, 255, 0.12); color: #eee; border: 1px solid rgba(255, 255, 255, 0.25);
                      border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; min-width: 64px; }
        #bar button:hover { background: rgba(255, 255, 255, 0.22); }
        #scrub { flex: 1; min-width: 0; accent-color: #9cf; }
        #clock { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
        #hint { position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); color: #aaa; pointer-events: none;
                text-shadow: 0 1px 2px #000; white-space: nowrap; }
        #error { position: fixed; top: 80px; left: 16px; right: 16px; color: #f77; }
        #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                  gap: 12px; pointer-events: none; }
        #loader-pct { font-size: 44px; font-weight: 300; font-variant-numeric: tabular-nums; color: #fff; }
        #loader-track { width: min(320px, 70vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.15); overflow: hidden; }
        #loader-fill { display: block; width: 0; height: 100%; background: #9cf; transition: width 0.15s linear; }
        #loader-name { color: #999; max-width: 80vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
    <canvas id="canvas-a"></canvas>
    <canvas id="canvas-b"></canvas>
    <div id="touch"></div>
    <div id="line"></div>
    <div class="label" id="label-a"><b>A</b><span></span></div>
    <div class="label" id="label-b"><b>B</b><span></span></div>
    <div id="hint">Move the mouse to compare · drag to turn · wheel to zoom into the face</div>
    <div id="error" hidden></div>
    <div id="loader" hidden><div id="loader-pct">0 %</div><div id="loader-track"><i id="loader-fill"></i></div><div id="loader-name"></div></div>
    <div id="bar">
        <button id="play" type="button">Pause</button>
        <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time">
        <span id="clock">0.00 / 0.00 s</span>
        <button id="sound" type="button" hidden>Enable sound</button>
    </div>
    <script type="module" src="./compare.js"></script>
</body>
</html>
