name: trainer image

# The flip-book training image (docker/trainer): built on demand or when its inputs change, pushed to
# ghcr.io/<owner>/animated-sog-trainer.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docker/trainer/**", "python/**", ".github/workflows/trainer-image.yml"]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      # the CUDA devel image, torch and the extension builds need more disk than the runner leaves free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/trainer/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/animated-sog-trainer:latest
            ghcr.io/${{ github.repository_owner }}/animated-sog-trainer:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
